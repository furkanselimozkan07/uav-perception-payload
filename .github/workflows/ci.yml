name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pyyaml matplotlib pytest
      - name: Unit tests
        run: pytest -q
      - name: Closed-loop simulation smoke test
        run: python scripts/run_sim.py --runs 1 --seed 3 --out /tmp/sim
